name: CI

# Run format + typecheck + tests + lint on every PR and on main pushes → block broken code before merge.
# Complements bundle-budget.yml (which guards shipped JS size); this guards correctness.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version is read from package.json's packageManager (pnpm@11.1.2) → matches local
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Native builds (sharp/@parcel/watcher, etc.) aren't needed for typecheck/test/lint,
      # so --ignore-scripts skips them. They are approved in pnpm-workspace.yaml under
      # allowBuilds for the environments that do need them (Vercel).
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Separate steps so a failure points at the exact check.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Lint
        run: pnpm lint

      # Formatting is enforced by format-on-save locally, which only helps people who
      # opened the repo in the configured editor. Fix with `pnpm format`.
      - name: Format
        run: pnpm format:check

      - name: Hook tests
        run: bash .claude/hooks/block-main-commit.test.sh
